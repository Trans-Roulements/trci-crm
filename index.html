<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C96A06">
<title>CRM Trans-Roulements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne type téléphone (560px max), en-tête collant, barre d'onglets fixe en bas, fiches en tiroir. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --fg:#15212C; --muted:#5A6774; --line:#D9DFE5;
  --accent:#C96A06; --accent-soft:#FBEBD9; --on-accent:#FFFFFF;
  --ok:#1C7F47; --ok-soft:#DFF3E7; --warn:#9A6408; --warn-soft:#FBF0D6; --bad:#B42525; --bad-soft:#FBE2E2;
  --none:#55626F; --none-soft:#E6EAEE; --scrim:rgba(10,18,26,.45);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1720; --surface:#15212C; --surface2:#1C2A37; --fg:#E6ECF1; --muted:#97A5B2; --line:#273746;
  --accent:#F08E28; --accent-soft:#3A2814; --on-accent:#1A1004;
  --ok:#43C17A; --ok-soft:#173326; --warn:#E3A841; --warn-soft:#352914; --bad:#F06A6A; --bad-soft:#3A1C1E;
  --none:#A5B1BC; --none-soft:#22303D; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1720; --surface:#15212C; --surface2:#1C2A37; --fg:#E6ECF1; --muted:#97A5B2; --line:#273746;
  --accent:#F08E28; --accent-soft:#3A2814; --on-accent:#1A1004;
  --ok:#43C17A; --ok-soft:#173326; --warn:#E3A841; --warn-soft:#352914; --bad:#F06A6A; --bad-soft:#3A1C1E;
  --none:#A5B1BC; --none-soft:#22303D; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.who{margin-left:auto;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.who select{max-width:200px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;font-size:13px}
.preview{background:var(--accent-soft);color:var(--fg);font-size:12.5px;display:flex;gap:10px;align-items:center;padding-block:7px;border-bottom:1px solid var(--line)}
.preview b{color:var(--accent)}
.preview button{margin-left:auto;flex-shrink:0;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

main{padding-block:16px 8px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:8px}

/* Boutons */
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--fg)}
.btn.pr{background:var(--accent);color:var(--on-accent)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cartes et lignes */
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;color:inherit}
button.row:hover{border-color:var(--muted)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.row .end{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.niv{font-family:var(--f-display);font-weight:700;font-size:15px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;background:var(--surface2);color:var(--muted)}
.niv.A{background:var(--accent);color:var(--on-accent)}
.niv.B{background:var(--accent-soft);color:var(--accent)}
.money{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.g-valide{background:var(--ok-soft);color:var(--ok)}
.g-a_verifier{background:var(--warn-soft);color:var(--warn)}
.g-non_conforme{background:var(--bad-soft);color:var(--bad)}
.g-non_verifie{background:var(--none-soft);color:var(--none)}
.s-actif{background:var(--ok-soft);color:var(--ok)}
.s-a_relancer{background:var(--warn-soft);color:var(--warn)}
.s-perdu{background:var(--none-soft);color:var(--none)}
.e-nouvelle{background:var(--none-soft);color:var(--none)}
.e-devis{background:var(--accent-soft);color:var(--accent)}
.e-negociation{background:var(--warn-soft);color:var(--warn)}
.e-gagnee{background:var(--ok-soft);color:var(--ok)}
.e-perdue{background:var(--bad-soft);color:var(--bad)}
.late{color:var(--bad);font-weight:600}

/* Chiffres */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}

/* Visite en cours */
.live{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.live .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.live .lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .lbl::before{animation:none}}
.live .cl{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.timer{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.live-grid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);font-size:14px}

/* Tiroir */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;z-index:1}
.sheet-h h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;flex:1;min-width:0}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.sheet-b{display:flex;flex-direction:column;gap:14px}

/* Formulaires */
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px}
.f textarea{min-height:76px;resize:vertical}
.f input:disabled{background:var(--surface2);color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 6px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:9px 12px}
.note.rule{border-left:3px solid var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.gps-res{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.gps-res b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.toggle{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{left:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.pres{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.dots{display:inline-flex;gap:2px;flex-wrap:wrap}
.dots i{width:7px;height:12px;border-radius:2px;display:block;background:currentColor}
.dots i.g-valide{color:var(--ok)}.dots i.g-a_verifier{color:var(--warn)}.dots i.g-non_conforme{color:var(--bad)}.dots i.g-non_verifie{color:var(--none)}
.dots i[class]{background-color:currentColor}
.row.alert{border-left:3px solid var(--bad)}
.alert-box{border-color:var(--bad);background:var(--bad-soft)}
.alist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.photo{max-width:100%;width:200px;border-radius:8px;border:1px solid var(--line);display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{cursor:pointer;align-self:flex-start}
.blocked{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-block:40px}
</style><style>
/* Compléments propres à la version connectée */
.login{max-width:420px;margin:0 auto;padding-block:48px 24px;display:flex;flex-direction:column;gap:16px}
.login .brand{font-size:34px}
.menu{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.who-name{font-size:13px;font-weight:600;text-align:right;line-height:1.2}
.who-name small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.gpsbox{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.gpsbox b{font-family:var(--f-display);font-size:22px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>

<script>
"use strict";
/* ════════════════════════════════════════════════
   CONFIGURATION
   La clé « anon » est publique par conception : la sécurité est assurée
   par les règles du script SQL, pas par ce fichier.
   Ne mettez JAMAIS la clé « service_role » ici.
   ════════════════════════════════════════════════ */
const SUPABASE_URL = "https://ndnocagegqpcforazwme.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbm9jYWdlZ3FwY2ZvcmF6d21lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTE3MjYsImV4cCI6MjA5NjA2NzcyNn0.USHDGBXQGa4SYywGJAVCmy42hLI618z47Ng96sY_8UA";
const BUCKET_PHOTOS = "photos-visites";
const POINT_MINUTES = 5;          // un point de présence toutes les 5 minutes
const PRECISION_MAX = 100;        // doit correspondre à gps_precision_max côté serveur

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

/* ───────── Outils ───────── */
const $ = (s, r = document) => r.querySelector(s);
// Construit un élément sans jamais interpréter le texte comme du HTML.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const fmtShort = n => n >= 1e6 ? (n / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " M" : new Intl.NumberFormat("fr-FR").format(n || 0);
const fmtDate = iso => new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtTime = iso => new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtDist = d => d >= 1000 ? (d / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " km" : d + " m";
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function inDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function toast(msg, ms = 2800) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t); setTimeout(() => t.remove(), ms);
}
// Traduit les erreurs serveur en phrases compréhensibles.
function msgErreur(e) {
  const m = (e && (e.message || e.error_description || String(e))) || "Erreur inconnue";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Pas de connexion internet. Réessayez quand le réseau revient.";
  if (/Invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
  if (/Email not confirmed/i.test(m)) return "Email non confirmé. Demandez à l'administrateur de valider votre compte.";
  if (/supprimer_membre/i.test(m) && /function|fonction|schema cache/i.test(m)) return "La suppression n'est pas encore installée : lancez d'abord le script SQL « ajout-suppression-commercial.sql » dans Supabase.";
  if (/row-level security|permission denied/i.test(m)) return "Action non autorisée pour votre compte.";
  if (/JWT|token/i.test(m)) return "Session expirée. Reconnectez-vous.";
  return m;
}
async function run(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}

/* ───────── Libellés ───────── */
const ROLES = { admin: "Administrateur", manager: "Manager", commercial: "Commercial" };
const TYPES = { mine: "Mine", cimenterie: "Cimenterie", industrie: "Industrie", agro: "Agro", transport: "Transport", btp: "BTP", portuaire: "Portuaire", prospect: "Prospect", autres: "Autres" };
const STATUTS = { actif: "Actif", a_relancer: "À relancer", perdu: "Perdu" };
const RESULTATS = { commande: "Commande", devis: "Demande de devis", relance: "À relancer", aucun: "Aucune suite" };
const ETAPES = { nouvelle: "Nouvelle", devis: "Devis envoyé", negociation: "Négociation", gagnee: "Gagnée", perdue: "Perdue" };
const ETAPES_OUVERTES = ["nouvelle", "devis", "negociation"];
const GPS_LBL = { valide: "GPS validé", a_verifier: "À vérifier", non_conforme: "Hors zone", non_verifie: "Non vérifié" };
const gpsPill = (s, d) => s ? h("span", { class: "pill g-" + s }, GPS_LBL[s] + (d != null ? " · " + fmtDist(d) : "")) : h("span", { class: "pill g-non_verifie" }, "Sans contrôle");

/* ───────── État ───────── */
const S = { session: null, me: null, users: [], anciens: [], clients: [], visites: [], opps: [], loaded: false };
const isChef = () => S.me && ["admin", "manager"].includes(S.me.role);
const isAdmin = () => S.me && S.me.role === "admin";
const isCom = () => S.me && S.me.role === "commercial";
const userName = id => {
  const u = S.users.find(x => x.id === id);
  if (u) return u.full_name || "—";
  const a = S.anciens.find(x => x.id === id);   // membre supprimé : on garde son nom sur l'historique
  return a ? (a.full_name || "—") + " (supprimé)" : "—";
};
const client = id => S.clients.find(c => c.id === id);
const visiteEnCours = () => S.visites.find(v => v.statut === "en_cours" && v.commercial_id === S.me.id);
const aVerifier = v => v.statut === "terminee" && !v.revue_decision && (v.alertes || []).length > 0;
const rayonDe = c => c.rayon_metres || 100;

async function chargerTout() {
  const [users, clients, visites, opps, anciens] = await Promise.all([
    run(sb.from("profiles").select("id,full_name,role,is_active,manager_id,zone").order("full_name")),
    run(sb.from("clients").select("*").order("raison_sociale")),

/* ───────── GPS réel ───────── */
// Plusieurs lectures pendant quelques secondes ; on garde la plus précise.
function mesurerPosition({ maxMs = 12000, cible = 20, onProgress } = {}) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { resolve(null); return; }
    let best = null, fini = false;
    const stop = res => { if (fini) return; fini = true; navigator.geolocation.clearWatch(wid); clearTimeout(tm); resolve(res); };
    const wid = navigator.geolocation.watchPosition(p => {
      const m = { lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) };
      if (!best || m.precision < best.precision) best = m;
      if (onProgress) onProgress(best);
      if (best.precision <= cible) stop(best);
    }, err => {
      if (err.code === 1) { fini = true; navigator.geolocation.clearWatch(wid); clearTimeout(tm); reject(Object.assign(new Error("refus"), { refus: true })); }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: maxMs });
    const tm = setTimeout(() => stop(best), maxMs);
  });
}

let pointIv = null, dernierPoint = 0;
async function ajouterPoint() {
  const v = S.me && visiteEnCours();
  if (!v || document.visibilityState !== "visible") return;
  dernierPoint = Date.now();
  try {
    const pos = await mesurerPosition({ maxMs: 8000, cible: 25 });
    await run(sb.from("visite_points").insert({ visite_id: v.id, lat: pos && pos.lat, lng: pos && pos.lng, precision_m: pos && pos.precision }));
    await rechargerVisite(v.id);
    if (page === "visites" && !$("#scrim")) render();
  } catch (e) { /* hors ligne ou GPS refusé : on réessaiera au prochain passage */ }
}
function suiviPresence() {
  clearInterval(pointIv);
  if (!S.me || !visiteEnCours()) return;
  pointIv = setInterval(() => { if (Date.now() - dernierPoint >= POINT_MINUTES * 60000 - 2000) ajouterPoint(); }, 30000);
}

// Réduit la photo avant envoi (côté le plus long : 1280 px).
function reduirePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("Image illisible")), "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image illisible")); };
    img.src = url;
  });
}

  const draw = () => seg.replaceChildren(...Object.entries(ETAPES).map(([k, l]) => h("button", { type: "button", "aria-pressed": String(k === etape), onclick: () => { etape = k; draw(); } }, l)));
  draw();
  const err = h("div", { class: "err", role: "alert" });
  let confirmSuppr = false;
  const suppr = edit ? actionBtn("Supprimer l'opportunité", "ghost full", err, async () => {
    if (!confirmSuppr) { confirmSuppr = true; throw new Error("Appuyez encore une fois pour confirmer la suppression."); }
    await run(sb.from("opportunites").delete().eq("id", o.id));
    S.opps = S.opps.filter(x => x.id !== o.id); closeSheet(); render(); toast("Opportunité supprimée");
  }) : null;
  openSheet(edit ? "Opportunité" : "Nouvelle opportunité", [
    field("Client *", cl), field("Intitulé *", titre),
    h("div", { class: "two" }, field("Montant estimé (FCFA)", montant), field("Prochaine relance", rel)),
    h("div", { class: "f" }, h("span", {}, "Étape"), seg),
    field("Notes", notes),
    edit ? h("div", { class: "note" }, "Suivie par " + userName(o.commercial_id) + " · créée le " + fmtDate(o.created_at)) : null,
    err,
    actionBtn(edit ? "Enregistrer" : "Créer l'opportunité", "pr full", err, async () => {
      if (!cl.value) throw new Error("Choisissez un client.");
      if (!titre.value.trim()) throw new Error("Donnez un intitulé à l'opportunité.");
      const m = montant.value.replace(/[\s  ]/g, "").replace(",", ".");
      if (m && !(Number(m) >= 0)) throw new Error("Montant invalide : chiffres uniquement, ex. 12500000.");
      const data = { client_id: cl.value, titre: titre.value.trim(), montant_estime: m ? Number(m) : null, etape, date_relance: rel.value || null, notes: notes.value.trim() || null };
      if (!edit && o.visite_id) data.visite_id = o.visite_id;
      const saved = edit
        ? await run(sb.from("opportunites").update(data).eq("id", o.id).select("*").single())
        : await run(sb.from("opportunites").insert(data).select("*").single());
      const i = S.opps.findIndex(x => x.id === saved.id);
      if (i >= 0) S.opps[i] = saved; else S.opps.unshift(saved);
      closeSheet(); if (page !== "opportunites") go("opportunites"); else render();
      toast(edit ? "Opportunité mise à jour" : "Opportunité créée");
    }),
    suppr,
  ]);
}

/* ───────── Page Équipe (administrateur) ───────── */
function pageEquipe() {
  const managers = S.users.filter(u => u.role === "manager" && u.is_active);
  const maj = async (u, patch, msg) => {
    try {
      const saved = await run(sb.from("profiles").update(patch).eq("id", u.id).select("id,full_name,role,is_active,manager_id,zone").single());
      Object.assign(u, saved); toast(msg);
    } catch (e) { toast(msgErreur(e), 4000); }
    render();
  };
  return [
    h("div", {}, h("h1", {}, "Équipe"), h("p", { class: "sub" }, "Rôles, managers et accès.")),
    h("div", { class: "note rule" }, "Pour ajouter quelqu'un : Supabase → Authentication → Add user (email + mot de passe provisoire). Le compte apparaît ici « suspendu ». Choisissez son rôle puis activez-le."),
    h("div", { class: "stack" }, S.users.map(u => {
      const self = u.id === S.me.id;
      const nom = h("input", { value: u.full_name || "", "aria-label": "Nom", onchange: e => { const v = e.target.value.trim(); if (v) maj(u, { full_name: v }, "Nom modifié"); } });
      const role = h("select", { "aria-label": "Rôle de " + (u.full_name || ""), disabled: self, onchange: e => maj(u, { role: e.target.value, manager_id: e.target.value === "commercial" ? u.manager_id : null }, "Rôle modifié") },
        Object.entries(ROLES).map(([k, l]) => h("option", { value: k }, l)));
      role.value = u.role;
      const mgr = u.role === "commercial" ? h("select", { "aria-label": "Manager", onchange: e => maj(u, { manager_id: e.target.value || null }, "Manager modifié") },
        h("option", { value: "" }, "Sans manager"), managers.map(m => h("option", { value: m.id }, m.full_name || "—"))) : null;
      if (mgr) mgr.value = u.manager_id || "";
      const tg = h("button", { class: "toggle", type: "button", role: "switch", "aria-checked": String(u.is_active), "aria-label": "Accès de " + (u.full_name || ""), disabled: self,
        onclick: () => maj(u, { is_active: !u.is_active }, u.is_active ? "Compte suspendu" : "Compte activé") });
      return h("div", { class: "row", style: "flex-wrap:wrap" },
        h("div", { class: "main", style: "flex-basis:60%" },
          h("div", { class: "t" }, (u.full_name || "—") + (self ? " (vous)" : "")),
          h("div", { class: "m" }, h("span", { class: u.is_active ? "" : "late" }, u.is_active ? "Actif" : "Suspendu"))),
        tg,
        h("div", { style: "flex-basis:100%" }, field("Nom affiché", nom)),
        h("div", { class: "two", style: "flex-basis:100%" }, field("Rôle", role), mgr ? field("Manager", mgr) : h("span")),
        !self && u.role !== "admin" ? h("div", { style: "flex-basis:100%;text-align:right" },
          h("button", { class: "btn ghost sm", type: "button", style: "color:var(--bad)", onclick: () => sheetSupprimerMembre(u) }, "Supprimer " + (u.full_name || "ce membre") + "…")) : null);
    })),
  ];
}

// Suppression définitive d'un membre : ses clients sont d'abord confiés à un autre commercial.
function sheetSupprimerMembre(u) {
  const nom = u.full_name || "ce membre";
  const nbClients = S.clients.filter(c => c.commercial_id === u.id).length;
  const nbOpps = S.opps.filter(o => o.commercial_id === u.id && ETAPES_OUVERTES.includes(o.etape)).length;
  const nbVisites = S.visites.filter(v => v.commercial_id === u.id).length;
  const aConfier = nbClients + nbOpps > 0;
  const repreneurs = S.users.filter(x => x.id !== u.id && x.role === "commercial" && x.is_active);
  const err = h("div", { class: "err", role: "alert" });
  const rep = h("select", { id: "sm-rep" }, h("option", { value: "" }, "— Choisir —"), repreneurs.map(x => h("option", { value: x.id }, x.full_name || "—")));
  const mot = h("input", { id: "sm-mot", autocomplete: "off", autocapitalize: "characters", placeholder: "SUPPRIMER" });
  const pluriel = (n, s) => n + " " + s + (n > 1 ? "s" : "");
  openSheet("Supprimer " + nom + " ?", [
    h("p", { style: "margin:0" }, "Son compte sera effacé : " + nom + " ne pourra plus se connecter. ", h("b", {}, "Cette action est définitive.")),
    h("ul", { style: "margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px" },
      h("li", {}, aConfier ? pluriel(nbClients, "client") + " et " + pluriel(nbOpps, "opportunité") + " en cours passeront au commercial choisi ci-dessous." : "Aucun client ni opportunité en cours à confier."),
      h("li", {}, "Ses visites (" + nbVisites + ") et ses opportunités gagnées ou perdues sont gardées, avec son nom, pour l'historique."),
      h("li", {}, "Une visite restée « en cours » sera annulée.")),
    h("div", { class: "note" }, "Pour un départ temporaire, utilisez plutôt l'interrupteur « Suspendu » : rien n'est effacé."),
    aConfier ? field("Confier ses clients à *", rep) : null,
    aConfier && !repreneurs.length ? h("div", { class: "err" }, "Aucun autre commercial actif : activez ou créez d'abord un commercial pour reprendre ses clients.") : null,
    field("Pour confirmer, tapez SUPPRIMER", mot),
    err,
    h("div", { class: "actions" },
      h("button", { class: "btn ghost", type: "button", onclick: closeSheet }, "Annuler"),
      actionBtn("Supprimer définitivement", "bad", err, async () => {
        if (aConfier && !rep.value) throw new Error("Choisissez le commercial qui reprend ses clients.");
        if (mot.value.trim().toUpperCase() !== "SUPPRIMER") throw new Error("Tapez le mot SUPPRIMER pour confirmer.");
        await run(sb.rpc("supprimer_membre", { p_id: u.id, p_repreneur: aConfier ? rep.value : null }));
        await chargerTout(); closeSheet(); render();
        toast(nom + " a été supprimé" + (aConfier ? ". Clients confiés à " + userName(rep.value) : ""), 4000);
      })),
  ]);
}

/* ───────── Démarrage et session ───────── */
async function ouvrirSession(session) {
  S.session = session;
  $("#root").replaceChildren(h("div", { class: "loading" }, h("span", { class: "spin" }), " Chargement…"));
  try {
    const me = await run(sb.from("profiles").select("id,full_name,role,is_active,manager_id,zone").eq("id", session.user.id).maybeSingle());
    if (!me || !me.is_active) {
      $("#root").replaceChildren(h("div", { class: "wrap" }, h("div", { class: "blocked" },
        h("h1", {}, me ? "Compte en attente ou suspendu" : "Compte non configuré"),
        h("p", { class: "sub" }, "Votre compte n'a pas encore été activé, ou il a été suspendu. Demandez à l'administrateur de l'activer dans l'écran Équipe."),
        h("button", { class: "btn ghost", type: "button", onclick: () => sb.auth.signOut() }, "Se déconnecter"))));
      return;
    }
    S.me = me;
    await chargerTout();
    coquille(); render(); suiviPresence();
  } catch (e) {
    $("#root").replaceChildren(h("div", { class: "wrap" }, h("div", { class: "blocked" },
      h("h1", {}, "Impossible de charger les données"), h("p", { class: "sub" }, msgErreur(e)),
      h("button", { class: "btn pr", type: "button", onclick: () => ouvrirSession(session) }, "Réessayer"),
      h("button", { class: "btn ghost", type: "button", onclick: () => sb.auth.signOut() }, "Se déconnecter"))));
  }
}
function fermerSession() {
  clearInterval(pointIv); clearInterval(timerIv); closeSheet();
  Object.assign(S, { session: null, me: null, users: [], anciens: [], clients: [], visites: [], opps: [], loaded: false });
  filtreCom = ""; rechClient = ""; filtreClient = "tous"; page = "visites";
  ecranConnexion();
}
let sessionCourante = null;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session && session.user && session.user.id;
  if (uid && uid !== sessionCourante) { sessionCourante = uid; setTimeout(() => ouvrirSession(session), 0); }
  else if (!uid && sessionCourante !== "") { sessionCourante = ""; fermerSession(); }
  else if (session) S.session = session;
});
const hp = (location.hash || "").slice(1);
if (PAGES[hp]) page = hp;
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (PAGES[p] && p !== page && S.me) { page = p; render(); } });
</script>
